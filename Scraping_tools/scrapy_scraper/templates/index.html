<!DOCTYPE html>
<html>
<head>
    <title>Scrapy Scraper</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-8 mx-auto">
                <h1 class="text-success">🕷️ Scrapy Scraper</h1>
                <div class="card">
                    <div class="card-body">
                        <div class="mb-3">
                            <label>URL</label>
                            <input type="url" class="form-control" id="url" value="https://news.ycombinator.com">
                        </div>
                        <div class="mb-3">
                            <label>CSS Selector</label>
                            <input type="text" class="form-control" id="selector" value=".titleline">
                        </div>
                        <button class="btn btn-success w-100" id="scrapeBtn">Scrape</button>
                    </div>
                </div>
                <div id="resultContainer" class="mt-4" style="display:none">
                    <div class="card">
                        <div class="card-body" id="resultContent"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('scrapeBtn').addEventListener('click', async function() {
            const url = document.getElementById('url').value;
            const selector = document.getElementById('selector').value;
            const container = document.getElementById('resultContainer');
            const content = document.getElementById('resultContent');
            container.style.display = 'block';
            content.innerHTML = '<div class="spinner-border"></div> Scraping...';
            try {
                const response = await fetch('/scrape', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({url, selector})
                });
                const data = await response.json();
                content.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch(e) {
                content.innerHTML = `<div class="alert alert-danger">${e.message}</div>`;
            }
        });
    </script>
</body>
</html>
